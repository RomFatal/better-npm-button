name: Publish VS Code Extension

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/publish.yml
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Publish whenever package.json's version isn't the one live on the
      # Marketplace. (Comparing with the previous commit missed a release when
      # the version bump wasn't the newest of the commits in one push.)
      - name: Detect version change
        id: version_check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          EXTENSION_ID=$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")
          # Empty when the extension isn't on the Marketplace yet.
          PUBLISHED_VERSION=$(npx vsce show "$EXTENSION_ID" --json 2>/dev/null \
            | node -e "try { console.log(JSON.parse(require('fs').readFileSync(0, 'utf8')).versions[0].version) } catch { console.log('') }")

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json: $CURRENT_VERSION, Marketplace: ${PUBLISHED_VERSION:-not published}"

          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npm run package:vsix

      - name: Publish to Visual Studio Marketplace
        if: steps.version_check.outputs.version_changed == 'true'
        run: npx @vscode/vsce publish --packagePath "$(ls -1 ./*.vsix | tail -n 1)"
